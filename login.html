  <link href="style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg sticky-top" data-bs-theme="dark">
  <div class="container">
    <a class="navbar-brand" href="index.html"><span><i class="bi bi-compass"></i> Jelajah Sulbar</span></a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-label="Buka menu"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav ms-auto align-items-lg-center">
        <li class="nav-item"><a class="nav-link" href="index.html">Beranda</a></li><li class="nav-item"><a class="nav-link" href="destinasi.html">Destinasi</a></li><li class="nav-item"><a class="nav-link" href="detail.html">Detail</a></li><li class="nav-item"><a class="nav-link" href="tentang.html">Tentang</a></li>

      </ul>

<main class="login-wrap py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-5">
        <div class="panel p-4 p-md-5">
          <div class="text-center mb-4"><h3 class="fw-bold">Masuk</h3><p class="text-body-secondary mb-0">Silakan isi data akun kamu.</p></div>
          <div id="pesan" aria-live="polite"></div>
          <form id="formLogin" novalidate>
            <div class="mb-3">
              <label for="identitas" class="form-label">Username atau Email</label>
              <input type="text" class="form-control" id="identitas" autocomplete="username" placeholder="namanama@email.com">
              <div class="invalid-feedback" id="errIdentitas"></div>
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input type="password" class="form-control" id="password" autocomplete="current-password" placeholder="Minimal 8 karakter, ada huruf dan angka">
              <div class="invalid-feedback" id="errPassword"></div>
              <div class="form-check mt-2"><input class="form-check-input" type="checkbox" id="lihat"><label class="form-check-label small" for="lihat">Tampilkan password</label></div>
            </div>
            <button type="submit" class="btn btn-aksen w-100 py-2">Masuk</button>
          </form>
          <p class="small text-body-secondary text-center mt-3 mb-0">Demo validasi form, tanpa database.</p>
        </div>
      </div>
    </div>
  </div>
</main>

</footer>
